<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid metal sample</title>
<script type="importmap">
{ "imports": {
  "react": "https://cdn.jsdelivr.net/npm/react@19.2.8/+esm",
  "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@19.2.8/jsx-runtime/+esm",
  "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/client/+esm",
  "@paper-design/shaders-react": "https://cdn.jsdelivr.net/npm/@paper-design/shaders-react@0.0.81/+esm",
  "https://cdn.jsdelivr.net/npm/react@19.3.0/": "https://cdn.jsdelivr.net/npm/react@19.2.8/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #e9e7e1; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage > * { width: 100%; height: 100%; }
  .note, .bar { position: absolute; z-index: 2; }
  .note {
    left: 14px; top: 12px; margin: 0;
    font: 500 11px/1.4 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: #5f636b;
  }
  .bar { left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 5px; border-radius: 999px;
    background: rgba(28,32,36,.08); }
  .bar button {
    font: 500 12px/1 ui-monospace, 'SF Mono', Menlo, monospace; color: #1c2024; background: none; border: 0;
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: #1c2024; color: #fff; }
  .bar button:focus-visible { outline: 2px solid #3a55c8; outline-offset: 2px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <p class="note" id="note">Liquid metal &middot; loading&hellip;</p>
  <div class="bar" role="group" aria-label="Source shape">
    <button type="button" data-src="logo" aria-pressed="true">our mark</button>
    <button type="button" data-src="metaballs" aria-pressed="false">metaballs</button>
    <button type="button" data-src="daisy" aria-pressed="false">daisy</button>
  </div>

  <script type="module">
    import { createElement as h } from 'react';
    import { createRoot } from 'react-dom/client';
    import { LiquidMetal } from '@paper-design/shaders-react';

    // The handbook's own mark: three offset bars, "the stack". Any flat black-on-transparent logo works.
    const mark = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
      '<rect x="30" y="34" width="120" height="34" rx="17" fill="#000"/>' +
      '<rect x="50" y="83" width="120" height="34" rx="17" fill="#000"/>' +
      '<rect x="30" y="132" width="120" height="34" rx="17" fill="#000"/>' +
      '</svg>');

    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const root = createRoot(document.getElementById('stage'));

    function render(src) {
      const source = src === 'logo' ? { image: mark } : { shape: src };
      root.render(h(LiquidMetal, {
        ...source,
        colorBack: '#e9e7e1', colorTint: '#8fa2ff',
        repetition: 4, softness: 0.45, shiftRed: 0.3, shiftBlue: 0.3,
        distortion: 0.1, contour: 0.9, angle: 70, scale: 0.62,
        speed: still ? 0 : 1
      }));
      document.getElementById('note').textContent = 'Paper Shaders · LiquidMetal · ' + (src === 'logo' ? 'image=our mark' : 'shape="' + src + '"');
    }

    document.querySelectorAll('.bar button').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      render(btn.dataset.src);
    }));
    render('logo');
  </script>
</body>
</html>
